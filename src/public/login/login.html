<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bybol</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/public/login/login.css">
  <style>.hidden { display: none; }</style>
</head>
<body>

  <div class="logo"><h1>B</h1></div>

  <!-- Tela inicial -->
  <div id="telaInicial">
    <div id="apresentacao">
      <h2>Olá, bem-vindo(a) ao Bybol!</h2>
      <p>Como você quer entrar?</p>
    </div>
    <div class="botoes">
      <button onclick="mostrarTela('telaCriarConta')" id="CriarConta">Criar Conta</button>
      <button onclick="mostrarTela('telaLogin')"      id="Login">Login</button>
      <button onclick="irPara('/src/components/readme.html')" id="Explorar">Explorar</button>
      <button onclick="mostrarTela('telaAnonimo')"    id="ModoAnonimo">Modo Anônimo</button>
    </div>
  </div>

  <!-- Tela de criar conta -->
  <div id="telaCriarConta" class="hidden">
    <h2>Criar conta</h2>
    <label>Nome: <input id="nomecriarconta" type="text" placeholder="Seu nome de usuário"></label><br>
    <label>Senha: <input id="senhadocriarconta" type="password" placeholder="Mínimo 6 caracteres"></label><br>
    <label>Email: <input id="emailaocriar" type="email" placeholder="seu@email.com"></label><br>
    <button onclick="cadastrar()" id="btnCadastrar">Cadastrar</button>
    <button onclick="mostrarTela('telaInicial')" class="btn-voltar" id="Voltar">← Voltar</button>
  </div>

  <!-- Tela de login -->
  <div id="telaLogin" class="hidden">
    <h2>Login</h2>
    <p>Bem-vindo(a) de volta, leitor(a)!</p>
    <label>Nome: <input id="nomelogin" type="text" placeholder="Seu login"></label><br>
    <label>Senha: <input id="senhalogin" type="password" placeholder="Sua senha"></label><br>
    <button onclick="fazerLogin()" id="btnLogin">Entrar</button>
    <button onclick="mostrarTela('telaInicial')" class="btn-voltar">← Voltar</button>
  </div>

  <!-- Tela modo anônimo -->
  <div id="telaAnonimo" class="hidden">
    <h2>Modo Anônimo</h2>
    <p>Você está navegando sem conta. Algumas funções estão desabilitadas.</p>
    <button onclick="irPara('/src/components/readme.html')" id="Explorar">Explorar livros</button>
    <button onclick="mostrarTela('telaInicial')" class="btn-voltar">← Voltar</button>
  </div>

  <div class="dark_mode">
    <button id="toggleDark">🌙 Dark Mode</button>
  </div>

  <footer>
    <div class="footer-left">
      <span class="icon">📘</span>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </div>
    <div class="footer-right">
      <span class="icon">✨</span>
      <a href="#">Termos</a>
      <a href="#">Privacidade</a>
    </div>
  </footer>

  <script src="login.js"></script>
  <script src="/src/utils/routga.js"></script>
</body>
</html>
